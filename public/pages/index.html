<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Welcome to RoomSync, the room and laboratory reservation system for Camarines Sur Polytechnic Colleges.">
  <meta name="theme-color" content="#12355B">
  <title>RoomSync</title>
  <link rel="icon" type="image/png" href="../assets/logos/logo.png">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 1.5rem;
      background: #091a30;
      isolation: isolate;
      transition: opacity .5s ease, transform .5s cubic-bezier(.2, .75, .25, 1);
    }
    body::before {
      content: "";
      position: fixed;
      z-index: -1;
      inset: -5%;
      background:
        radial-gradient(ellipse at 22% 25%, rgba(65, 139, 224, .3), transparent 38%),
        radial-gradient(ellipse at 78% 75%, rgba(61, 119, 194, .24), transparent 36%),
        linear-gradient(145deg, rgba(9, 26, 48, .72), rgba(10, 20, 38, .92)),
        url("../assets/images/bg.jpg") center / cover no-repeat;
      animation: background-drift 22s ease-in-out infinite alternate;
      will-change: transform;
    }
    body.leaving { opacity: 0; transform: scale(1.035); }
    .splash {
      position: relative;
      isolation: isolate;
      width: min(100%, 42rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      padding: clamp(2rem, 7vw, 3.5rem) clamp(1.5rem, 6vw, 3rem);
      text-align: center;
      color: #fff;
      animation: splash-in .9s cubic-bezier(.2, .75, .25, 1) both;
      will-change: transform, opacity;
    }
    .splash::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: -45%;
      left: 50%;
      width: 75%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(120, 180, 255, .2);
      filter: blur(70px);
      transform: translateX(-50%);
      animation: glow-breathe 5s ease-in-out infinite alternate;
    }
    .splash-logo-wrap {
      position: relative;
      width: clamp(15rem, 66vw, 27rem);
      aspect-ratio: 1;
    }
    .splash-logo-wrap::before {
      content: "";
      position: absolute;
      inset: 20%;
      z-index: -1;
      border-radius: 50%;
      background: rgba(79, 156, 255, .28);
      filter: blur(52px);
      animation: logo-aura 2.4s ease-out both;
    }
    .splash-logo {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      filter: drop-shadow(0 .75rem 1.5rem rgba(0, 0, 0, .24));
    }
    .splash-logo-wrap::after {
      content: "";
      position: absolute;
      z-index: 2;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 42%, rgba(215, 237, 255, .9) 49%, rgba(255, 255, 255, .96) 50%, rgba(215, 237, 255, .9) 51%, transparent 58%);
      mix-blend-mode: screen;
      transform: translateX(-110%) skewX(-14deg);
      -webkit-mask: url("../assets/logos/roomsync-logo-assembly-fixed.svg") center / contain no-repeat;
      mask: url("../assets/logos/roomsync-logo-assembly-fixed.svg") center / contain no-repeat;
      animation: logo-sheen .9s ease-out 4.85s both;
    }
    .splash-tagline {
      margin: 0;
      color: rgba(255, 255, 255, .72);
      font-size: clamp(.68rem, 2vw, .82rem);
      font-weight: 700;
      letter-spacing: .17em;
      line-height: 1.6;
      text-transform: uppercase;
    }
    .splash-progress {
      position: relative;
      width: min(19rem, 64vw);
      height: 3px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, .18);
      box-shadow: 0 0 14px rgba(153, 197, 255, .12);
      margin: .35rem 0 .1rem;
    }
    .splash-progress span {
      display: block;
      width: 100%;
      height: 100%;
      transform: scaleX(0);
      transform-origin: left;
      border-radius: inherit;
      background: linear-gradient(90deg, #8fc5ff, #fff, #b9d9ff);
      box-shadow: 0 0 12px rgba(185, 217, 255, .65);
      animation: splash-progress 6.2s cubic-bezier(.22, .61, .36, 1) forwards;
    }
    .splash-link {
      display: inline-flex;
      min-height: 2.9rem;
      align-items: center;
      justify-content: center;
      padding: .7rem 1.35rem;
      border: 1px solid rgba(255, 255, 255, .5);
      border-radius: 999px;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }
    .splash-link:hover {
      transform: translateY(-2px);
      border-color: #fff;
      background: rgba(255, 255, 255, .14);
    }
    .splash-link:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }
    @keyframes splash-in {
      from { opacity: 0; transform: translateY(22px) scale(.97); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes logo-aura {
      0% { opacity: 0; transform: scale(.55); }
      38% { opacity: .9; }
      100% { opacity: .35; transform: scale(1.2); }
    }
    @keyframes logo-sheen {
      0% { opacity: 0; transform: translateX(-110%) skewX(-14deg); }
      18% { opacity: .9; }
      100% { opacity: 0; transform: translateX(110%) skewX(-14deg); }
    }
    @keyframes splash-progress { to { transform: scaleX(1); } }
    @keyframes background-drift {
      from { transform: scale(1.02) translate3d(-.5%, -.5%, 0); }
      to { transform: scale(1.09) translate3d(.5%, .5%, 0); }
    }
    @keyframes glow-breathe {
      from { opacity: .55; transform: translateX(-50%) scale(.85); }
      to { opacity: 1; transform: translateX(-50%) scale(1.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        animation-delay: 0s !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        will-change: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="splash">
    <div class="splash-logo-wrap">
      <img class="splash-logo" src="../assets/logos/roomsync-logo-assembly-fixed.svg" alt="RoomSync" fetchpriority="high">
    </div>
    <p class="splash-tagline">Room &amp; Laboratory Reservation System</p>
    <div class="splash-progress" aria-hidden="true">
      <span></span>
    </div>
  </main>
  <script>
    const destination = localStorage.getItem('rr_token') && localStorage.getItem('rr_user')
      ? 'dashboard.html'
      : 'home.html';
    setTimeout(() => {
      document.body.classList.add('leaving');
      setTimeout(() => location.replace(destination), 500);
    }, 6200);
  </script>
</body>
</html>
